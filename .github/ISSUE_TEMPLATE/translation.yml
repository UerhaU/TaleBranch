name: "Translation correction / Исправление перевода"
description: "Report incorrect wording and suggest a correction / Сообщить об ошибке и предложить исправление."
title: "[Translation] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve TaleBranch translations! You may write in Russian or English, or provide the correction in the affected language.

        Спасибо за помощь с переводом TaleBranch! Можно написать по-русски или по-английски, а исправленный текст — на языке перевода.
  - type: input
    id: language
    attributes:
      label: "Language / Язык"
      placeholder: "Например: коми-пермяцкий (koi), српски (sr), English (en)"
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: "Where is the error? / Где ошибка?"
      description: "Screen, button, section of README, or steps to find the text / Экран, кнопка, раздел README или как найти текст."
    validations:
      required: true
  - type: textarea
    id: current-text
    attributes:
      label: "Current text / Текущий текст"
      description: "Copy the wording as it appears / Скопируйте текст с ошибкой."
    validations:
      required: true
  - type: textarea
    id: suggested-text
    attributes:
      label: "Suggested correction / Как правильно"
      description: "Write the complete corrected text / Напишите полный исправленный вариант."
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: "Explanation / Пояснение"
      description: "Optional: explain the context or grammar / Необязательно: поясните контекст или правило."
  - type: input
    id: version
    attributes:
      label: "Version or commit / Версия или коммит"
      description: "If known / Если известны."
  - type: textarea
    id: screenshot
    attributes:
      label: "Screenshot / Скриншот"
      description: "Optional. Remove personal data before attaching / Необязательно. Скройте личные данные перед прикреплением."
