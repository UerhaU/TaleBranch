name: "Bug report / Сообщить об ошибке"
description: "Report a problem in a test build / Сообщить о проблеме в тестовой сборке."
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What happened? / Что произошло?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / Как повторить"
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior / Ожидаемый результат"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Version and operating system / Версия и операционная система"
  - type: textarea
    id: extra
    attributes:
      label: "Additional details / Дополнительные сведения"
      description: "Optional screenshots or error messages. Remove personal data / Необязательные скриншоты или сообщения об ошибках. Скройте личные данные."
