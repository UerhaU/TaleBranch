name: Windows portable candidate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup default stable
      - run: npm ci
      - name: Test and build portable without the local game icon set
        shell: powershell
        run: ./scripts/build-portable.ps1 -AllowMissingIcons
      - uses: actions/upload-artifact@v4
        with:
          name: talebranch-windows-portable
          if-no-files-found: error
          path: |
            release/portable/TaleBranch-*-portable.exe
            release/portable/TaleBranch-*-portable.zip
            release/portable/TaleBranch-*-SHA256.txt
