name: CI

on:
  push:
    branches: ["main", "check/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: npm test
      - run: npm run build

  desktop:
    # Rust is not installed on the owner's computer, so the desktop part is compiled and tested here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup default stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
